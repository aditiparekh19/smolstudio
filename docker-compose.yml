services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smolstudio-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${DATABASE_PASSWORD:-SmolStudioDev2026_Xy9}
    ports:
      - "1434:1433"
    volumes:
      - smolstudio_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DATABASE_PASSWORD:-SmolStudioDev2026_Xy9}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      DATABASE_HOST: sqlserver
      DATABASE_PORT: ${DATABASE_PORT:-1433}
      DATABASE_NAME: ${DATABASE_NAME:-smolstudio}
      DATABASE_USER: ${DATABASE_USER:-sa}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-SmolStudioDev2026_Xy9}
      DATABASE_ENCRYPT: ${DATABASE_ENCRYPT:-false}
      DATABASE_TRUST_SERVER_CERT: ${DATABASE_TRUST_SERVER_CERT:-true}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GST_RATE_PERCENT: ${GST_RATE_PERCENT:-0}
      SHIPPING_FLAT_INR: ${SHIPPING_FLAT_INR:-0}
      FREE_SHIPPING_THRESHOLD_INR: ${FREE_SHIPPING_THRESHOLD_INR:-0}
      PAYMENT_RESERVATION_MINUTES: ${PAYMENT_RESERVATION_MINUTES:-15}
      STORE_SUPPORT_EMAIL: ${STORE_SUPPORT_EMAIL:-support@smolstudio.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-SmolStudio <orders@smolstudio.local>}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
    ports:
      - "4000:4000"
    volumes:
      - smolstudio_product_uploads:/app/apps/api/uploads

volumes:
  smolstudio_sql_data:
  smolstudio_product_uploads:
